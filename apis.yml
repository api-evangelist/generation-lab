aid: generation-lab
name: Generation Lab
description: 'Generation Lab is a longevity science company founded in 2023 by Alina Su,
  UC Berkeley bioengineer Dr. Irina Conboy, and Michael Suswal, and backed by an $11M
  seed round led by Accel (Accel''s first longevity bet). Its flagship SystemAge test
  measures biological age across roughly 460 biomarkers spanning 19 to 21 physiological
  systems and organs from an at-home, needle-free blood collection, returning a personalized
  aging report and science-backed action plan that ranges from lifestyle and supplement
  guidance to clinical interventions. The test is distributed through 300+ clinic
  partners across 18 countries and via a patient/provider portal. Generation Lab publishes
  no public developer API, OpenAPI, SDKs, or developer portal at this time; this profile
  captures its public web, product, and legal surfaces.'
